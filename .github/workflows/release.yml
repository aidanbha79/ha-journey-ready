name: Prepare release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, for example v0.1.0"
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest -q --timeout=60
      - run: python -m ruff check .
  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Check version and build
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c "import json,os; m=json.load(open('custom_components/journey_ready/manifest.json')); assert os.environ['RELEASE_TAG']=='v'+m['version'], 'Tag must match manifest'"
          python tools/build_release.py
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/journey_ready.zip --verify-tag --generate-notes --draft
